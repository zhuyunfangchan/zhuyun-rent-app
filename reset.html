<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17483e">
  <title>设置新密码 · 竹韵房产</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5f6f1;color:#18332e;font:15px/1.6 system-ui,"Noto Sans SC",sans-serif}.panel{width:min(440px,100%);background:white;border:1px solid #e4e8df;border-radius:18px;padding:30px;box-shadow:0 18px 50px #1c302a15}.brand{color:#17483e;font-weight:800;letter-spacing:.04em}.mark{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;border-radius:11px;background:#17483e;color:#e7d7a5}h1{font-size:23px;margin:25px 0 8px}p{color:#69766e;font-size:13px}label{display:block;margin:16px 0 6px;color:#52645a;font-size:12px;font-weight:700}input{width:100%;padding:12px;border:1px solid #dce5dc;border-radius:9px;font:inherit;outline-color:#79a58a}button{width:100%;border:0;border-radius:9px;background:#17483e;color:white;padding:13px;font:inherit;font-weight:700;margin-top:20px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.message{min-height:24px;margin-top:14px}.back{display:inline-block;margin-top:8px;color:#246b59;font-size:13px;text-decoration:none}
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand"><span class="mark">竹</span>竹韵房产</div>
    <h1>设置新密码</h1>
    <p>为运营者账号设置新密码。密码由 Supabase 安全保存，不会存进网站配置文件。</p>
    <form id="resetForm" hidden>
      <label for="password">新密码（至少 8 位）</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirmPassword">再次输入新密码</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
      <button id="submitButton" type="submit">保存新密码</button>
    </form>
    <p class="message" id="message" role="status" aria-live="polite">正在验证重置链接…</p>
    <a class="back" href="./index.html#admin">返回竹韵房产</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script>
    (async()=>{
      const message=document.querySelector('#message'),form=document.querySelector('#resetForm'),button=document.querySelector('#submitButton');
      const params=new URLSearchParams(location.hash.slice(1));
      const errorText=params.get('error_description')||params.get('error');
      if(errorText){message.textContent='重置链接无效或已过期，请重新申请密码重置邮件。';return;}
      const cfg=window.ZHUYUN_CONFIG||{};
      if(!cfg.supabaseUrl||!cfg.supabasePublishableKey||!window.supabase?.createClient){message.textContent='网站尚未完成在线配置，请稍后再试。';return;}
      const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
      const {data,error}=await client.auth.getSession();
      if(error||!data.session||params.get('type')!=='recovery'){message.textContent='重置链接无效或已过期，请重新申请密码重置邮件。';return;}
      form.hidden=false;message.textContent='链接验证成功。请输入并确认新密码。';
      form.onsubmit=async event=>{
        event.preventDefault();
        const password=document.querySelector('#password').value;
        const confirmPassword=document.querySelector('#confirmPassword').value;
        if(password!==confirmPassword){message.textContent='两次输入的密码不一致。';return;}
        button.disabled=true;button.textContent='正在保存…';
        const result=await client.auth.updateUser({password});
        button.disabled=false;button.textContent='保存新密码';
        if(result.error){message.textContent='保存失败，请重新申请重置链接后再试。';return;}
        form.hidden=true;message.textContent='新密码已保存。即将返回运营后台登录页…';
        setTimeout(()=>location.replace('./index.html#admin'),1400);
      };
    })();
  </script>
</body>
</html>
